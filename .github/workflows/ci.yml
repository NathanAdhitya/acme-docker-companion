name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

  integration:
    name: Pebble integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Real DNS-01 issuance and failover against a local Pebble ACME server.
      # Never contacts a production CA.
      - run: ACMED_INTEGRATION=1 go test ./internal/acmex/ -run TestPebble -v -count=1

  e2e:
    name: Container end-to-end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: bash test/e2e.sh
